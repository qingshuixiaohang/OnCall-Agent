name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - run: uv run ruff check app/services/rag_pipeline.py app/services/vector_search_service.py app/services/vector_index_service.py app/api/file.py app/tools/knowledge_tool.py tests/
      - run: uv run pytest tests/ -v