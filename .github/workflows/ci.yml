name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SILICONFLOW_API_KEY: "ci-placeholder"
      DASHSCOPE_API_KEY: "ci-placeholder"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3
      - run: uv sync --extra dev
      - run: uv run ruff check . --exclude .venv --exclude htmlcov --exclude .git
      - run: uv run pytest tests/ -v